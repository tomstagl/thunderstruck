apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
spec:
  template:
    spec:
      containers:
        - name: app
          image: loadgenerator:1
          env:
            - name: LEDGER_ADDR
              value: ledger:8080
            - name: LOG_LEVEL
              value: info
            - name: LEDGER_ADDRESS
              value: ledger:8080
