          kind: file_absent
          anchor: '\w*(?:[Hh]ttp[Cc]lient|[Rr]estTemplate|[Ww]eb[Cc]lient)\s*\.\s*(?!(?:builder|newBuilder|newHttpClient|create|mutate)\s*\()\w+\s*\('
          absent: '(?i)(fallback|degrade|stale|default(Value|Response)|onErrorReturn|onErrorResume|\.exceptionally\s*\()|\bcatch\s*\(\s*(?:final\s+)?(?:[\w.]+\s*\|\s*)*(?:Exception|RuntimeException|Throwable|[\w.]*(?:RestClient|WebClient|Http|IO|Rpc|StatusRuntime|Feign|Timeout|Connect|Socket|ResourceAccess|CallNotPermitted)\w*Exception)\s+\w+\s*\)\s*\{(?:[^{};]*;){0,3}\s*return\b|@\s*Recover\b|CircuitBreakerFactory'
          confidence: low
          note: "external call with no fallback branch"

  - id: S16
    name: Jitter on periodic work
    tier: B
    weight: 0.6
    metastable_role: trigger
    failure_if_absent: >-
      Self-inflicted bursts. Every instance fires at :00 together and the
      dependency sees its whole day's peak in one second.
    references:
      - "Google SRE Book, ch. 24 — Distributed Periodic Scheduling"
      - "Brooker, Exponential Backoff And Jitter"
    detectors:
      typescript:
        - id: S16-ts-setinterval-no-jitter
          kind: regex
          pattern: '\bsetInterval\s*\('
          absent_within: '(?i)\b(jitter|random|offset|stagger|splay)\b'
          present_within: '(?i)(fetch|axios|\bgot\b|http|sync|poll|refresh|heartbeat|query|publish|flush|client|\bapi\b|request|send|emit|ping)'
          window: 5
          confidence: medium
          note: "setInterval with no jitter or offset — every instance fires in lockstep"
        - id: S16-ts-fixed-cron
          kind: regex
          pattern: '(?i)(cron\s*[:(]\s*[''"`]|schedule\s*\(\s*[''"`])\s*(0|\*/?\d*)\s+'
          absent_within: '(?i)\b(jitter|random|offset|stagger|splay)\b'
          window: 5
          confidence: low
          note: "cron schedule pinned to a fixed minute with no splay"
      python:
        - id: S16-py-fixed-sleep-loop
          kind: regex
          pattern: '\b(time\s*\.\s*sleep|asyncio\s*\.\s*sleep)\s*\(\s*\d+(\.\d+)?\s*\)'
          present_within: '(?i)\b(while\s+True|schedule|periodic|poll)\b'
          window: 8
          confidence: low
          note: "periodic loop with a fixed sleep and no jitter"
        - id: S16-py-fixed-cron
          kind: regex
          pattern: '(?i)(crontab|CronTrigger|cron_schedule)\s*\('
          absent_within: '(?i)\b(jitter|random|offset|stagger|splay)\b'
          window: 5
          confidence: low
          note: "cron schedule pinned to a fixed minute with no splay"
      java:
        - id: S16-java-scheduled-no-jitter
          kind: regex
          pattern: '@\s*Scheduled\s*\([^)]*\bcron\s*='
          absent_within: '(?i)(jitter|random|splay|stagger)|@\s*SchedulerLock\b'
          window: 10
          window_before: 3
          confidence: low
          note: "@Scheduled cron with no jitter — cron fires on the wall clock, so every instance fires in lockstep"

  - id: S17
    name: Steady state (TTLs, cleanup, growth bounds)
    tier: B
    weight: 0.6
    metastable_role: trigger
    failure_if_absent: >-
      Slow resource exhaustion. Fine for weeks, then the cache or the table
      crosses a limit and the process dies at 3am.
    references:
      - "Nygard, Release It! (2nd ed.), ch. 5 — Steady State"
    detectors:
      typescript:
        - id: S17-ts-cache-without-ttl
          kind: file_absent
          anchor: '^(?:export\s+)?(?:const|let|var)\s+\w+[^=\n]*=\s*new\s+Map\b|^[ \t]+(?!(?:const|let|var|return)\b)(?:(?:private|protected|public|readonly|static)\s+)*#?\w+[^=\n(]*=\s*new\s+Map\b|\w*[Cc]ache\s*\.\s*set\s*\('
          absent: '(?i)\b(ttl|expire|expiry|evict|maxSize|max_size|maxAge|lru|clear\s*\()\b'
          confidence: medium
          note: "module-level or class-field Map cache with no TTL, eviction, or size bound"
      python:
        - id: S17-py-cache-without-ttl
          kind: file_absent
          anchor: '(?i)cache\s*\[|cache\s*\.\s*(set|update)\s*\(|_cache\s*='
          absent: '(?i)\b(ttl|expire|expiry|evict|maxsize|max_size|max_age|lru|clear\s*\()\b'
          confidence: low
          note: "in-memory cache with no TTL, eviction, or size bound"
      java:
        - id: S17-java-unbounded-cache
          kind: file_absent
          anchor: '(?i)\b\w*(cache|caches|cachemap|cached\w*|memo(?!ry)\w*)\s*=\s*new\s+(Concurrent)?HashMap\b|\b\w*(cache|caches|cachemap|cached\w*)\s*\.\s*(put|putIfAbsent)\s*\(|Caffeine\s*\.\s*newBuilder\s*\('
          require: '^\s*(private|protected|public|static|final)\b[^;=(){}]*=\s*new\s+(Concurrent)?HashMap\b|\b(Caffeine|CacheBuilder)\s*\.\s*newBuilder\s*\('
          absent: '(?i)(ttl|expire|evict|maximumSize|maximumWeight|removeEldestEntry|\.clear\s*\(|removeIf\s*\(|\.\s*size\s*\(\s*\)\s*>|softValues|weakKeys|weakValues)|<\s*Class\s*<|\bCacheManager\b|\bgetCache\s*\('
          confidence: low
          note: "in-memory cache with no TTL, eviction, or size bound"

  - id: S18
    name: Fail fast (validate before expensive work)
    tier: B
    weight: 0.6
    metastable_role: amplifier
    failure_if_absent: >-
      Expensive calls are made for requests that were always going to fail
      validation, wasting exactly the capacity that is scarce under load.
    references:
      - "Nygard, Release It! (2nd ed.), ch. 5 — Fail Fast"
    detectors:
      typescript:
        - id: S18-ts-validate-after-call
          kind: module
          handler: s18_fail_fast
          confidence: low
          note: "validation appears after an expensive external call"
      python:
        - id: S18-py-validate-after-call
          kind: module
          handler: s18_fail_fast
          confidence: low
          note: "validation appears after an expensive external call"
      java:
        - id: S18-java-validate-after-call
          kind: module
          handler: s18_fail_fast
          confidence: low
          note: "validation appears after an expensive external call"

  - id: S19
    name: No error swallowing; failures stay observable
    tier: B
    weight: 0.6
    metastable_role: sustaining
    failure_if_absent: >-
      Silent data drift. The write path fails, nothing is logged, and the
      divergence is only discovered months later by a user.
    references:
      - "Nygard, Release It! (2nd ed.), ch. 17 — Transparency"
      - "Google SRE Book, ch. 6 — Monitoring Distributed Systems"
    detectors:
      typescript:
        - id: S19-ts-empty-catch
          kind: regex
          pattern: 'catch\s*(?:\((?![^)]*\b(?:_\w*|ignored?|expected|unused)\s*\))[^)]*\))?\s*\{\s*\}'
          confidence: high
          note: "empty catch block — the failure leaves no trace (a parameter named _x, ignored, expected or unused marks it deliberate)"
        - id: S19-ts-catch-only-comment
          kind: regex
          pattern: 'catch\s*(\([^)]*\))?\s*\{\s*(//.*)?$'
          present_within: '^\s*\}'
          window: 2
          window_offset: 1
          confidence: medium
          note: "catch block with no handling beyond a comment"
      python:
        - id: S19-py-except-pass
          kind: regex
          pattern: '^\s*except\s*(?:\(?[^:#]*\b(?:Exception|BaseException)\b[^:]*)?:\s*$'
          present_within: '^\s*pass\s*$'
          window: 2
          window_offset: 1
          confidence: high
          note: "except:/except Exception: with only pass — the failure leaves no trace"
        - id: S19-py-bare-except
          kind: regex
          pattern: 'except\s*:\s*$'
          confidence: medium
          note: "bare except catches SystemExit and KeyboardInterrupt too, and this one does not re-raise"
          absent_within: '\A(?:[ \t]*\n)*([ \t]+)\S[^\n]*(?:\n(?:\1[^\n]*|[ \t]*))*?\n?\1[ \t]*raise\b'
          window: 8
          window_offset: 1
      java:
        - id: S19-java-empty-catch
          kind: regex
          # A parameter named `ignored`/`ignore`/`expected`/`unused` (or the
          # unnamed `_`) is the Java convention for a deliberate swallow, the
          # one IntelliJ's and Error Prone's empty-catch checks honour. The
          # parameter list is bounded ({0,200}) so a pathological line of
          # unclosed `catch (` stays linear.
          pattern: 'catch\s*\((?![^)]{0,200}[\s|](?i:ignored?|expected|unused)\d*\s*\)|[^)]{0,200}\s_\s*\))[^)]{0,200}\)\s*\{\s*\}'
          # Parking a thread until the process is killed: a latch nobody
          # counts down, or joining the current thread. The interrupt is the
          # intended exit, so swallowing it loses nothing.
          absent_within: 'new\s+CountDownLatch\s*\(\s*1\s*\)\s*\.\s*await\s*\(\s*\)|Thread\s*\.\s*currentThread\s*\(\s*\)\s*\.\s*join\s*\(\s*\)'
          window_before: 2
          confidence: medium
          note: "empty catch block — the failure leaves no trace"
        - id: S19-java-catch-only-comment
          kind: regex
          pattern: 'catch\s*\((?![^)]{0,200}[\s|](?i:ignored?|expected|unused)\d*\s*\)|[^)]{0,200}\s_\s*\))[^)]{0,200}\)\s*\{\s*$'
          present_within: '^\s*\}'
          window: 1
          window_offset: 1
          confidence: medium
          note: "catch block with no handling beyond a comment"

  # ------------------------------------------- Tier A (JVM-specific) --
  - id: S27
    name: No blocking calls on non-blocking/event-loop threads
    tier: A
    weight: 1.0
    metastable_role: amplifier
    failure_if_absent: >-
      A blocking call inside a reactive pipeline or an event-loop handler
      occupies a thread meant to service many concurrent requests. One slow
      call starves the whole event loop instead of one request.
    references:
      - "Project Reactor reference docs — Schedulers and blocking calls"
      - "Nygard, Release It! (2nd ed.), ch. 4 — Blocked Threads"
    detectors:
      java:
        - id: S27-java-blocking-in-reactive
          kind: regex
          pattern: '\bThread\s*\.\s*sleep\s*\(|\bDriverManager\s*\.\s*getConnection\s*\(|\.\s*execute(Query|Update)\s*\(|[Hh]ttp[Cc]lient\s*\.\s*send\s*\(|(restTemplate|RestTemplate|jdbcTemplate|JdbcTemplate)\s*\.\s*\w+\s*\('
          present_within: '\b(Mono|Flux)\b|reactor\.core|io\.netty|ChannelHandlerContext|akka\.stream'
          absent_within: 'Schedulers\s*\.\s*(boundedElastic|fromExecutor\w*|newBoundedElastic)|\bsubscribeOn\s*\(|\bpublishOn\s*\('
          window: 20
          window_before: 12
          confidence: low
          note: "blocking call inside a Reactor/WebFlux/Netty/Akka-Streams context with no scheduler offload — starves the event loop"

  - id: S28
    name: Bounded, timed lock/wait acquisition
    tier: A
    weight: 1.0
    metastable_role: sustaining
    failure_if_absent: >-
      A lock held across a slow call, or a wait with no bound, lets one
      stalled holder block every other thread indefinitely — a convoy that
      compounds under load instead of shedding it.
    references:
      - "Nygard, Release It! (2nd ed.), ch. 4 — Blocked Threads"
      - "java.util.concurrent.locks.Lock javadoc — tryLock(long, TimeUnit)"
    detectors:
      java:
        - id: S28-java-monitor-held-across-io
          kind: regex
          pattern: '\bsynchronized\s*\(|\bsynchronized\s+[\w<]'
          present_within: '(?s)\A(?:(?!\}).)*?(?:\bThread\s*\.\s*sleep\s*\(|\.\s*(send|exchange|executeQuery|executeUpdate|getForObject|getForEntity|postForObject|postForEntity|getConnection|block)\s*\(|\.\s*join\s*\(\s*\))'
          window: 15
          confidence: low
          note: "synchronized section makes a blocking call before it closes — a stalled call holds the monitor and every other thread queues behind it"
        - id: S28-java-untimed-lock-across-io
          kind: regex
          pattern: '\.\s*(lock|lockInterruptibly)\s*\(\s*\)'
          present_within: '(?s)\A(?:(?!\.\s*unlock\s*\().)*?(?:\bThread\s*\.\s*sleep\s*\(|\.\s*(send|exchange|executeQuery|executeUpdate|getForObject|getForEntity|postForObject|postForEntity|getConnection|block)\s*\(|\.\s*join\s*\(\s*\))'
          window: 15
          confidence: low
          note: "Lock.lock() with no timed tryLock, held across a blocking call before unlock()"
        - id: S28-java-untimed-wait
          kind: regex
          pattern: '(\.\s*|^\s*)(await|wait)\s*\(\s*\)(?!\s*\.\s*atMost)'
          # Contracts that block by definition: BlockingQueue put*/take*, and
          # the untimed awaitTermination() beside its timed variant. A latch
          # nobody counts down parks a launcher's main thread on purpose.
          absent_within: '@Override\s+(public\s+)?[\w<>\[\],\s]*?\b(put|take)\w*\s*\(|\bvoid\s+awaitTermination\s*\(\s*\)|new\s+CountDownLatch\s*\(\s*1\s*\)\s*\.\s*await\s*\(\s*\)'
          window_before: 8
          confidence: low
          note: "Condition.await()/Object.wait() with no timeout — waits forever if the signal never comes"

  - id: S29
    name: Bounded query fan-out (no N+1 lazy-loading amplification)
    tier: A
    weight: 1.0
    metastable_role: amplifier
    failure_if_absent: >-
      Iterating a result set and touching a lazy association per row turns
      one query into N+1. Under load this is a fan-out amplifier — the same
      mechanism as an unbounded result set, but produced by ORM lazy loading
      rather than a missing limit.
    references:
      - "Hibernate ORM user guide — Fetching"
      - "Nygard, Release It! (2nd ed.), ch. 4 — Unbounded Result Sets"
    detectors:
      java:
        - id: S29-java-n-plus-one
          kind: module
          handler: s29_n_plus_one
          confidence: low
          note: "loop navigates an association per row with no eager fetch hint in the file"

# ---------------------------------------------------------------- Tier C ----
# Catalogued for the investigator's vocabulary; not scanned in v1.
tier_c:
  - id: S20
    name: Shuffle sharding
    failure_if_absent: "One bad tenant degrades every tenant sharing its shard."
    references: ["Amazon Builders' Library — Workload isolation using shuffle-sharding"]
  - id: S21
    name: Cell-based architecture
    failure_if_absent: "Blast radius of any failure is the whole fleet."
    references: ["Amazon Builders' Library — Reducing blast radius with cell-based architecture"]
  - id: S22
    name: Static stability across AZs and regions
    failure_if_absent: "Recovery depends on the control plane that is itself impaired."
    references: ["Amazon Builders' Library — Static stability using Availability Zones"]
  - id: S23
    name: Adaptive concurrency limits
    failure_if_absent: "A fixed limit is wrong at both ends: throttling when healthy, overloading when degraded."
    references: ["Netflix — Performance Under Load (adaptive concurrency limits)"]
  - id: S24
    name: Multi-level criticality shedding
    failure_if_absent: "Overload sheds load indiscriminately, dropping critical work with the rest."
    references: ["Google SRE Book, ch. 21 — Criticality"]
  - id: S25
    name: Hedged requests
    failure_if_absent: "Tail latency is set by the slowest replica on every request."
    references: ["Dean & Barroso, The Tail at Scale (CACM 2013)"]
  - id: S26
    name: Leader-election hardening
    failure_if_absent: "Split brain or a stuck leader stalls all coordinated work."
    references: ["Google SRE Book, ch. 23 — Managing Critical State"]
