# thunderstruck stability pattern catalog
#
# Each entry describes a stability pattern, what fails when it is absent, and
# heuristics for spotting its absence in source. Detector hits are LEADS, not
# findings: the investigator subagent confirms or rejects each one against the
# actual code, and a finding never rests on a detector hit alone.
#
# Tiers here are generic defaults. A repo re-prioritises them in
# .thunderstruck.toml (see examples/thunderstruck.toml.example).
#
# Detector kinds
#   regex        `pattern` matches a line. Optional `absent_within` (regex that
#                must NOT appear in the `window` lines from the match) and
#                `present_within` (regex that MUST appear there). Optional
#                `require` means the same as for file_absent: the file must
#                match it somewhere, or the detector is skipped.
#   file_absent  `anchor` matches somewhere in the file AND `absent` matches
#                nowhere in it. Optional `require` must ALSO match somewhere
#                in the file — use it to scope a whole-file absence to files
#                that actually do the thing the pattern guards (a fan-out, a
#                retry), instead of every file that mentions the anchor.
#                Hit is reported at the first anchor line.
#   module       dispatches to a handler in scripts/detectors/. For patterns
#                where a regex cannot see the structure that matters.
#
# `confidence` is the detector's own self-assessment and feeds hit weighting.
# It is NOT the finding's confidence — only the investigator sets that.

version: 1
schema: thunderstruck.catalog/v1

languages:
  typescript:
    extensions: [".ts", ".tsx", ".mts", ".cts"]
  javascript:
    extensions: [".js", ".jsx", ".mjs", ".cjs"]
  python:
    extensions: [".py", ".pyi"]
  java:
    extensions: [".java"]

# Language aliases: a detector written for `typescript` also runs on javascript.
aliases:
  javascript: typescript

patterns:
  # ---------------------------------------------------------------- Tier A --
  - id: S01
    name: Timeouts on every external call
    tier: A
    weight: 1.0
    metastable_role: amplifier
    failure_if_absent: >-
      Blocked threads or a stalled event loop. One hung dependency holds
      connections open until the whole app stops serving.
    references:
      - "Nygard, Release It! (2nd ed.), ch. 5 — Timeouts"
      - "Amazon Builders' Library — Timeouts, retries and backoff with jitter"
    detectors:
      typescript:
        - id: S01-ts-fetch-no-signal
          kind: regex
          pattern: '\bfetch\s*\('
          absent_within: '\b(signal|AbortSignal|timeout|AbortController)\b|\bfetch\s*\([^,()]*(?:\([^()]*\))?[^,()]*,\s*[A-Za-z_$][\w$.]*\s*\)'
          window: 8
          window_before: 6
          confidence: medium
          note: "fetch() with no AbortSignal or timeout in the request options"
        - id: S01-ts-axios-no-timeout
          kind: regex
          pattern: '\baxios\s*(\.\s*(get|post|put|patch|delete|request)\s*)?\('
          absent_within: '\btimeout\b'
          window: 8
          window_before: 6
          confidence: medium
          note: "axios call with no timeout option"
        - id: S01-ts-node-http-no-timeout
          kind: regex
          pattern: '\b(https?|http2)\s*\.\s*(request|get)\s*\('
          absent_within: '\btimeout\b'
          window: 8
          window_before: 6
          confidence: medium
          note: "node http(s) request with no timeout option"
      python:
        - id: S01-py-requests-no-timeout
          kind: regex
          pattern: '\brequests\s*\.\s*(get|post|put|patch|delete|head|request)\s*\('
          absent_within: '\btimeout\s*=|\*\*\w+\s*\)'
          window: 6
          window_before: 4
          confidence: high
          note: "requests call with no timeout= (requests blocks forever by default)"
        - id: S01-py-httpx-no-timeout
          kind: regex
          pattern: '\bhttpx\s*\.\s*(AsyncClient|Client|get|post|put|patch|delete|request)\s*\('
          absent_within: '\btimeout\s*=|\*\*\w+\s*\)'
          window: 6
          window_before: 4
          confidence: low
          note: "httpx call with no explicit timeout= (httpx does default to 5s)"
        - id: S01-py-urlopen-no-timeout
          kind: regex
          pattern: '\burlopen\s*\('
          absent_within: '\btimeout\s*=|\*\*\w+\s*\)'
          window: 4
          window_before: 4
          confidence: high
          note: "urlopen() with no timeout="
        - id: S01-py-socket-no-timeout
          kind: regex
          pattern: '\bsocket\s*\.\s*socket\s*\('
          absent_within: '\b(settimeout|setdefaulttimeout)\b'
          window: 10
          confidence: medium
          note: "raw socket with no settimeout()"
      java:
        - id: S01-java-httpclient-no-connect-timeout
          kind: file_absent
          anchor: '(?:(?<=java\.net\.http\.)|(?<![\w$]\.))\bHttpClient\s*\.\s*(newBuilder\s*\(\s*\)|newHttpClient\s*\(\s*\))'
          absent: '\bconnectTimeout\s*\(|\.\s*timeout\s*\(\s*[^\s)]'
          confidence: medium
          note: "java.net.http.HttpClient built with no connectTimeout(), and no request in the file sets .timeout() (which also bounds the connect)"
        - id: S01-java-httprequest-no-timeout
          kind: regex
          pattern: '(?:(?<=java\.net\.http\.)|(?<![\w$]\.))\bHttpRequest\s*\.\s*newBuilder\s*\('
          absent_within: '\.\s*timeout\s*\(|\.\s*set(Url|HttpMethod|Body|OidcToken|OauthToken)\s*\(|\bputHeaders\s*\('
          window: 8
          confidence: medium
          note: "HttpRequest with no .timeout() — HttpClient has no default request timeout, so send() can wait forever"
        - id: S01-java-okhttp-no-timeout
          kind: regex
          pattern: '\bOkHttpClient\s*\.\s*Builder\s*\(\s*\)|new\s+OkHttpClient\s*\(\s*\)'
          absent_within: '\bcallTimeout\s*\('
          window: 8
          confidence: low
          note: "OkHttpClient with no callTimeout — the per-operation defaults do not bound a slow-drip response"
        - id: S01-java-jdbc-no-login-timeout
          kind: regex
          pattern: '\bDriverManager\s*\.\s*getConnection\s*\('
          absent_within: '\bsetLoginTimeout\s*\(|[''"?&;](connectTimeout|loginTimeout|socketTimeout)[''"=]'
          window: 4
          window_before: 6
          confidence: low
          note: "DriverManager.getConnection with no login timeout — some drivers wait forever for an unreachable host"
        - id: S01-java-future-get-no-timeout
          kind: regex
          pattern: '\b\w*[Ff]uture\w*\s*\.\s*(get|join)\s*\(\s*\)|\.\s*join\s*\(\s*\)'
          present_within: '\b(CompletableFuture|Future)\b'
          # A get() behind a positive `if (f.isDone())` guard returns at once.
          absent_within: '\b(orTimeout|completeOnTimeout)\s*\(|\bif\s*\(\s*[\w.]+\s*\.\s*isDone\s*\(\s*\)\s*\)'
          window: 2
          window_before: 6
          confidence: low
          note: "Future.get()/join() with no timeout — blocks forever if the future never completes"
        - id: S01-java-resttemplate-no-timeout
          kind: regex
          pattern: 'new\s+(\w+\.)*RestTemplate\s*\(\s*\)|new\s+(\w+\.)*SimpleClientHttpRequestFactory\s*\(\s*\)'
          absent_within: '\b(setConnectTimeout|setReadTimeout|setConnectionRequestTimeout|connectTimeout|readTimeout)\s*\(\s*[^\s)]|\bsetRequestFactory\s*\(\s*(?!new\s+[\w.]+\s*\(\s*\))[^\s)]'
          window: 8
          confidence: low
          note: "RestTemplate with no connect/read timeout — its default request factory waits forever"
        - id: S01-java-webclient-no-timeout
          kind: file_absent
          anchor: '\bWebClient\s*\.\s*(builder|create)\s*\('
          absent: '\.\s*timeout\s*\(\s*[^\s)]|\bresponseTimeout\s*\(\s*[^\s)]|ReadTimeoutHandler|CONNECT_TIMEOUT_MILLIS|\bclientConnector\s*\(\s*(?!new\s+[\w.]+\s*\(\s*(\)|HttpClient\s*\.\s*create\s*\(\s*\)\s*\)))[^\s)]'
          confidence: low
          note: "WebClient built with no responseTimeout(), configured connector or per-call timeout() anywhere in the file"
        - id: S01-java-jms-receive-no-timeout
          kind: regex
          pattern: '\.\s*receive\s*\(\s*\)'
          # Evidence of a JMS consumer on a line that is not an import, so a
          # JMS import does not make an application type's receive() a JMS one.
          # 50 lines back: a consumer is often created at the top of a method
          # and read from much further down (artemis's XA example: 43 lines).
          present_within: '^(?!\s*import\s)[^\n]*?(?:\b(?:MessageConsumer|JMSConsumer|QueueReceiver|TopicSubscriber)\b|\bcreate(?:Consumer|Receiver|Subscriber|DurableSubscriber|DurableConsumer|SharedConsumer|SharedDurableConsumer)\s*\(|\b(?:javax|jakarta)\s*\.\s*jms\b)'
          window: 1
          window_before: 50
          confidence: low
          note: "JMS receive() with no timeout — blocks the thread until a message arrives, forever if none does"

  - id: S02
    name: Capped exponential backoff with full jitter
    tier: A
    weight: 1.0
    metastable_role: sustaining
    failure_if_absent: >-
      Synchronised retries hammer a recovering dependency and hold it down —
      the classic thundering herd. Uncapped growth parks work for minutes.
    references:
      - "Brooker, Exponential Backoff And Jitter (AWS Architecture Blog)"
      - "Nygard, Release It! (2nd ed.), ch. 5 — Retries"
    detectors:
      typescript:
        - id: S02-ts-backoff
          kind: module
          handler: s02_backoff
          confidence: medium
          note: "retry backoff missing a cap, jitter, or growth"
      python:
        - id: S02-py-backoff
          kind: module
          handler: s02_backoff
          confidence: medium
          note: "retry backoff missing a cap, jitter, or growth"
      java:
        - id: S02-java-backoff
          kind: module
          handler: s02_backoff
          confidence: low
          note: "retry backoff missing a cap, jitter, or growth"
        - id: S02-java-retryable-no-jitter
          kind: regex
          pattern: '@\s*Retryable\b'
          absent_within: 'random\s*=\s*true|RandomBackOffPolicy|ExponentialRandomBackOffPolicy|jitter\s*='
          window: 12
          confidence: low
          note: "@Retryable with no randomised backoff — Spring Retry defaults to a fixed 1s wait, so every client retries in lockstep"

  - id: S03
    name: Honor server pushback (Retry-After, 429/503)
    tier: A
    weight: 1.0
    metastable_role: sustaining
    failure_if_absent: >-
      Retries land inside a window the server has already told you is closed,
      so the limiter never gets a chance to reopen.
    references:
      - "RFC 9110 §10.2.3 — Retry-After"
      - "Google SRE Book, ch. 21 — Handling Overload"
    detectors:
      typescript:
        - id: S03-ts-429-ignores-retry-after
          kind: file_absent
          anchor: '\b429\b|TOO_MANY_REQUESTS|tooManyRequests'
          absent: '[Rr]etry-?[Aa]fter|retry_after|RETRY_AFTER'
          require: '(?i)\b(retry|retries|retrying|attempt|attempts|backoff|sleep|setTimeout|delay|wait)\b'
          confidence: high
          note: "file handles 429 but never reads Retry-After"
        - id: S03-ts-503-ignores-retry-after
          kind: file_absent
          anchor: '\b503\b|SERVICE_UNAVAILABLE'
          absent: '[Rr]etry-?[Aa]fter|retry_after|RETRY_AFTER'
          require: '(?i)\b(retry|retries|retrying|attempt|attempts|backoff|sleep|setTimeout|delay|wait)\b'
          confidence: low
          note: "file handles 503 but never reads Retry-After"
      python:
        - id: S03-py-429-ignores-retry-after
          kind: file_absent
          anchor: '\b429\b|TOO_MANY_REQUESTS|too_many_requests'
          absent: '[Rr]etry-?[Aa]fter|retry_after|RETRY_AFTER'
          require: '(?i)\b(retry|retries|retrying|attempt|attempts|backoff|sleep|setTimeout|delay|wait)\b'
          confidence: high
          note: "file handles 429 but never reads Retry-After"
        - id: S03-py-503-ignores-retry-after
          kind: file_absent
          anchor: '\b503\b|SERVICE_UNAVAILABLE'
          absent: '[Rr]etry-?[Aa]fter|retry_after|RETRY_AFTER'
          require: '(?i)\b(retry|retries|retrying|attempt|attempts|backoff|sleep|setTimeout|delay|wait)\b'
          confidence: low
          note: "file handles 503 but never reads Retry-After"
      java:
        - id: S03-java-429-ignores-retry-after
          kind: file_absent
          anchor: '\b429\b|TOO_MANY_REQUESTS'
          absent: '[Rr]etry-?[Aa]fter|RETRY_AFTER'
          require: '(?s)\A(?=.*?(?i:\b(retry|retries|retrying|attempt|attempts|backoff|sleep|delay)\b)|.*?\b(?!(?:set|get|is|has)[A-Z])\w+[Rr]etry\w*\s*\()(?=.*?(\.\s*(send|sendAsync|exchange|execute|retrieve|getForObject|getForEntity|postForObject|postForEntity|newCall)\s*\(|\bstatusCode\s*\(\s*\)|getStatusCode\s*\(\s*\)|\.\s*code\s*\(\s*\)))'
          confidence: low
          note: "file handles 429 but never reads Retry-After"
        - id: S03-java-503-ignores-retry-after
          kind: file_absent
          anchor: '\b503\b|SERVICE_UNAVAILABLE|HTTP_UNAVAILABLE'
          absent: '[Rr]etry-?[Aa]fter|RETRY_AFTER'
          require: '(?s)\A(?=.*?(?i:\b(retry|retries|retrying|attempt|attempts|backoff|sleep|delay)\b)|.*?\b(?!(?:set|get|is|has)[A-Z])\w+[Rr]etry\w*\s*\()(?=.*?(\.\s*(send|sendAsync|exchange|execute|retrieve|getForObject|getForEntity|postForObject|postForEntity|newCall)\s*\(|\bstatusCode\s*\(\s*\)|getStatusCode\s*\(\s*\)|\.\s*code\s*\(\s*\)))'
          confidence: low
          note: "file handles 503 but never reads Retry-After"

  - id: S04
    name: Retry only transient errors
    tier: A
    weight: 1.0
    metastable_role: amplifier
    failure_if_absent: >-
      Retrying a 4xx burns the retry budget on requests that can never
      succeed, and hides the bug that caused them.
    references:
      - "Amazon Builders' Library — Timeouts, retries and backoff with jitter"
    detectors:
      typescript:
        - id: S04-ts-retry-without-discrimination
          kind: file_absent
          anchor: '\b(maxRetries|MAX_RETRIES|retryCount|retries|retryAttempt)\b'
          absent: '\b(5\d\d|status\s*>=\s*500|isTransient|isRetryable|ECONNRESET|ETIMEDOUT|429|statusCode\s*>=|axiosRetry|axios-retry|retryCondition|shouldRetry|retryIf|retryOn|isNetworkError|isRetryableError|isNetworkOrIdempotentRequestError)\b|\bbail\s*\(|\bAbortError\b|\bonFailedAttempt\b|\bhandle(?:When|Type|Result)\s*\('
          confidence: medium
          note: "retry construct with no visible transient/permanent discrimination"
      python:
        - id: S04-py-bare-except-retry
          kind: regex
          pattern: 'except\s*(Exception\s*)?(as\s+\w+\s*)?:'
          present_within: '^\s*for\s+(?:_\w*|(?:\w+_)?(?:attempts?|retr\w*|tries|try)\w*)\s+in\s+range\b|\b(?:retry|retries|retrying|attempts?|backoff)\b'
          window: 6
          confidence: medium
          note: "catch-all except followed by a retry — retries permanent errors too"
          window_before: 6
        - id: S04-py-retry-without-discrimination
          kind: file_absent
          anchor: '\b(max_retries|MAX_RETRIES|retry_count|retries|num_retries)\b'
          absent: '\b(5\d\d|status_code\s*>=\s*500|is_transient|is_retryable|ConnectionError|Timeout|429|retry_if\w*|status_forcelist|allowed_methods|giveup|retry_on_exception|retry_on_result|retryable_exceptions)\b'
          confidence: medium
          note: "retry construct with no visible transient/permanent discrimination"
      java:
        - id: S04-java-catch-all-retry
          kind: regex
          pattern: 'catch\s*\(\s*(final\s+)?(Exception|Throwable|RuntimeException)\s+\w+\s*\)'
          # Retry vocabulary counts only outside a string literal (an even
          # number of quotes follows it on its line): a log message that says
          # "retry" is not a retry.
          present_within: '(?m)\b(attempt|attempts|retry|retries|retrying)\b(?=(?:[^"\n]*"[^"\n]*")*[^"\n]*$)'
          absent_within: '\bthrow\b|isRetryable|isTransient|shouldRetry|instanceof'
          window: 4
          window_before: 6
          confidence: low
          note: "catch (Exception e) followed by a retry — retries permanent errors too"
        - id: S04-java-retryable-all-exceptions
          kind: regex
          pattern: '@\s*Retryable\b'
          absent_within: '\b(retryFor|include|value|noRetryFor|exclude|exceptionExpression|includes|excludes|predicate)\s*=|@\s*Retryable\s*\(\s*\{?\s*[\w.]+\.class'
          window: 12
          confidence: low
          note: "@Retryable with no exception filter — retries every exception, permanent ones included"

  - id: S05
    name: Client-side rate limiting / budget gating
    tier: A
    weight: 1.0
    metastable_role: trigger
    failure_if_absent: >-
      A shared quota is exhausted by one caller, and every other caller on
      that quota starts failing.
    references:
      - "Google SRE Book, ch. 21 — Handling Overload"
      - "Nygard, Release It! (2nd ed.), ch. 5 — Governor"
    detectors:
      typescript:
        - id: S05-ts-http-without-limiter
          kind: file_absent
          anchor: '\bfetch\s*\(|\b(axios|got)\s*(\.\s*(get|post|put|patch|delete|head|request))?\s*\(|\bsuperagent\s*\.|\bundici\s*\.\s*(request|fetch)\s*\('
          absent: '(?i)\b(ratelimit|rate_limit|rate-limit|limiter|throttle|bottleneck|semaphore|token.?bucket|p-?limit|pLimit)\b'
          require: '(?i)(Promise\s*\.\s*(all|allSettled)|\bfor\s*(await\s*)?\(|\bfor\s+await\b|\bwhile\s*\(|\.(map|forEach)\s*\(|setInterval)'
          confidence: medium
          note: "HTTP calls made in a loop or fan-out with no local rate limiter or concurrency gate in this file"
        - id: S05-ts-ratelimit-headers-unread
          kind: file_absent
          anchor: '(?i)\bratelimit\b|\brate.?limit\b'
          absent: '(?i)headers\s*\.\s*get\s*\(\s*[''"`][^''"`]*ratelimit|x-.*-ratelimit'
          confidence: low
          note: "rate limiting mentioned but server rate-limit headers are never read"
      python:
        - id: S05-py-http-without-limiter
          kind: file_absent
          anchor: '^([ \t]*)(?:async\s+)?(?:for|while)\b[^\n]*:[ \t]*\n(?:\1[ \t]+[^\n]*\n|[ \t]*\n){0,8}?\1[ \t]+[^\n]*\b(?:requests|httpx|http|\w*[Ss]ession|\w*[Cc]lient)\s*\.\s*(?:get|post|put|patch|delete|head|request)\s*\(|\basyncio\s*\.\s*gather\s*\(\s*\*\s*[\[(][^\n]*\bfor\b|\b\w*(?:pool|executor)\w*\s*\.\s*map\s*\('
          absent: '(?i)\b(ratelimit|rate_limit|limiter|throttle|semaphore|token.?bucket|aiolimiter)\b'
          require: '^\s*(?:import|from)\s+(?:requests|httpx|aiohttp|urllib3)\b'
          confidence: medium
          note: "HTTP calls made in a loop or fan-out with no local rate limiter or concurrency gate in this file"
      java:
        - id: S05-java-client-calls-without-limiter
          kind: file_absent
          anchor: '^[ \t]*(?:for|while)\s*\((?![^\n]*\b(?:List|Set|Stream|Arrays)\s*\.\s*(?:of|asList)\s*\()[^\n]*\n(?:(?![ \t]*\}[ \t]*$)[^\n]*\n){0,8}?[^\n]*(?:[Hh]ttp[Cc]lient|[Rr]estTemplate|[Ww]eb[Cc]lient|[Ss]tub)\s*\.\s*(?!(?:builder|newBuilder|newHttpClient|create|mutate)\s*\()\w+\s*\(|\.\s*(?:forEach|parallelStream\s*\(\s*\)[^;]{0,200}?\.\s*(?:map|forEach))\s*\([^;]{0,300}?(?:[Hh]ttp[Cc]lient|[Rr]estTemplate|[Ww]eb[Cc]lient|[Ss]tub)\s*\.\s*(?!(?:builder|newBuilder|newHttpClient|create|mutate)\s*\()\w+\s*\('
          require: '(?m)^\s*(for|while)\s*\(|\.\s*forEach\s*\(|\.\s*parallelStream\s*\(|CompletableFuture\s*\.\s*allOf\s*\('
          absent: '(?i)(ratelimit|rate_limit|limiter|throttle|bucket4j|\bBucket\b|Semaphore|\.acquire\s*\(|\bsleep\s*\()'
          confidence: low
          note: "outbound calls made in a loop or fan-out with no local rate limiter or concurrency gate in this file"

  - id: S06
    name: Request prioritization (interactive over background)
    tier: A
    weight: 1.0
    metastable_role: amplifier
    failure_if_absent: >-
      Batch work starves user-facing requests: both queue behind the same
      limiter, and the batch always wins on volume.
    references:
      - "Google SRE Book, ch. 21 — Criticality"
      - "Nygard, Release It! (2nd ed.), ch. 5 — Shed Load"
    detectors:
      typescript:
        - id: S06-ts-single-queue-no-priority
          kind: file_absent
          anchor: '(?i)^(?:export\s+)?(?:const|let|var)\s+\w*(?:queue|limiter|throttle|worker|pool)\w*\b[^=\n]*=|^[ \t]+(?:(?:private|protected|public|readonly|static)\s+)*#?\w*(?:queue|limiter|throttle|worker|pool)\w*\b[^=\n]*='
          absent: '(?i)\b(priority|interactive|criticality|tier|urgent|foreground)\b'
          confidence: low
          note: "one shared queue/limiter declared at module or class level; no priority or criticality field"
      python:
        - id: S06-py-single-queue-no-priority
          kind: file_absent
          anchor: '(?im)^\w+\s*(?::[^=\n]+)?=\s*[\w.]*(?:queue|limiter|throttle|worker|pool|executor|semaphore)\w*\s*\(|\bself\.\w+\s*(?::[^=\n]+)?=\s*[\w.]*(?:queue|limiter|throttle|worker|pool|executor|semaphore)\w*\s*\('
          absent: '(?i)\b(priority|interactive|criticality|tier|urgent|foreground)\b'
          confidence: low
          note: "one shared queue/limiter/pool serves all callers; no priority or criticality field"
      java:
        - id: S06-java-single-pool-no-priority
          kind: file_absent
          # A pool this file creates. An injected executor is sized and shared
          # elsewhere; a virtual-thread executor queues nothing behind a fixed
          # number of workers.
          anchor: '\bExecutors\s*\.\s*new(?!VirtualThreadPerTaskExecutor|ThreadPerTaskExecutor)\w*\s*\(|new\s+ThreadPoolExecutor\s*\('
          # More than one kind of work reaches it: two submission sites, or a
          # pass-through of a caller's task — a `Runnable`/`Callable<…>`/
          # `Supplier<…>` parameter submitted before the method's first `}`
          # (within 600 characters, which keeps the scan linear).
          # A pool that runs one job of its own (`submit(this)`, a Runnable
          # field, a loader built in a loop, a scheduled flush), or is only
          # built and handed on (a bean, a gRPC server's executor), has no
          # callers to prioritise. `execute(` counts only on an executor- or
          # pool-named receiver: `statement.execute(sql)` is JDBC.
          require: '(?s)(?:\.\s*(?:submit|invokeAll|invokeAny)|\b(?:supplyAsync|runAsync)|(?i:exec|pool|workers?|scheduler)\w*\s*\.\s*execute)\s*\(.*(?:\.\s*(?:submit|invokeAll|invokeAny)|\b(?:supplyAsync|runAsync)|(?i:exec|pool|workers?|scheduler)\w*\s*\.\s*execute)\s*\(|[(,]\s*(?:final\s+)?(?:Runnable|Callable\s*<[^>]*>|Supplier\s*<[^>]*>)\s+(\w+)\s*[,)][^}]{0,600}?(?:\.\s*submit|(?i:exec|pool|workers?|scheduler)\w*\s*\.\s*execute)\s*\(\s*\1\s*\)'
          # A second pool: two creations, or one made through a static import
          # (a bare `newFixedThreadPool(…)`) beside the anchored one.
          absent: '(?i)(priority|interactive|criticality|urgent|foreground|background|batch)|(?s:(Executors\s*\.\s*new\w*|new\s+ThreadPoolExecutor)\s*\(.*(Executors\s*\.\s*new\w*|new\s+ThreadPoolExecutor)\s*\()|(?<![\w.])new(?:Fixed|Cached|Scheduled|SingleThread|WorkStealing)\w*\s*\('
          confidence: low
          note: "one executor serves every caller; no priority or criticality separation"

  - id: S07
    name: Idempotent, resumable jobs
    tier: A
    weight: 1.0
    metastable_role: sustaining
    failure_if_absent: >-
      A crash mid-job restarts from zero or writes duplicates. Every retry
      pays the full cost again, so the job never gets further than the
      failure point.
    references:
      - "Nygard, Release It! (2nd ed.), ch. 5 — Handshaking / Steady State"
      - "Google SRE Book, ch. 22 — Addressing Cascading Failures"
    detectors:
      typescript:
        - id: S07-ts-uncheckpointed-loop
          kind: module
          handler: s07_checkpoint
          confidence: medium
          note: "paged/batched loop with no persisted cursor — a crash restarts from the beginning"
        - id: S07-ts-create-without-upsert
          kind: file_absent
          anchor: '(?<!Object)(?<!axios)(?<!Reflect)(?<!document)(?<!Buffer)(?<!Error)(?<!React)\.\s*create(Many)?\s*\(|INSERT\s+INTO'
          absent: '(?i)\b(upsert|ON\s+CONFLICT|ON\s+DUPLICATE\s+KEY|MERGE\s+INTO|idempotenc|P2002|E11000|ER_DUP_ENTRY|23505|UniqueViolation|DuplicateKey)'
          confidence: medium
          note: "inserts with no upsert / ON CONFLICT — a replayed job duplicates rows"
      python:
        - id: S07-py-uncheckpointed-loop
          kind: module
          handler: s07_checkpoint
          confidence: medium
          note: "paged/batched loop with no persisted cursor — a crash restarts from the beginning"
        - id: S07-py-insert-without-upsert
          kind: file_absent
          anchor: '\bsession\w*\s*\.\s*(add|add_all|bulk_save_objects)\s*\(|\b(db|conn|cursor|collection|table|model|engine)\w*\s*\.\s*(insert|insert_one|insert_many)\s*\(|INSERT\s+INTO'
          absent: '(?i)\b(upsert|ON\s+CONFLICT|ON\s+DUPLICATE\s+KEY|MERGE\s+INTO|idempotenc|IntegrityError|UniqueViolation|DuplicateKey)'
          confidence: medium
          note: "inserts with no upsert / ON CONFLICT — a replayed job duplicates rows"
      java:
        - id: S07-java-uncheckpointed-loop
          kind: module
          handler: s07_checkpoint
          confidence: low
          note: "paged/batched loop with no persisted cursor — a crash restarts from the beginning"
        - id: S07-java-kafka-no-manual-commit
          kind: file_absent
          # Not the import line: the hit lands where the consumer is used.
          anchor: '^(?!\s*import\s).*\bKafkaConsumer\b'
          # A poll with an argument on one line (Kafka's poll(Duration) or
          # poll(long), not a BlockingQueue's poll() or poll(timeout,
          # TimeUnit)), in a file where auto-commit can ack a record whose
          # processing has not finished: the polled records are handed to an
          # executor or async stage (`submit(() -> process(records))`,
          # `records.forEach(r -> pool.submit(...))`), or auto-commit is off
          # and nothing commits, so every restart re-reads from the reset
          # point. Starting the loop's own thread (`new Thread(runner)`,
          # `executor.submit(this::run)`) is not a hand-off, and a parallel
          # stream finishes before the next poll. A synchronous loop under auto-commit is at-least-once —
          # poll() commits only what the previous poll returned — and is the
          # KafkaConsumer javadoc's own example, so it is left alone.
          require: '\A(?=[\s\S]*?\.\s*poll\s*\((?![^;\n]*TimeUnit)\s*[^\s)][^;\n]*\))[\s\S]*?(?:\b(?:submit|execute|runAsync|supplyAsync)\s*\([^;\n]*(?i:records?|recs?)\b|(?i:records?)\s*\.\s*forEach\s*\([^;\n]*\b(?:submit|execute|runAsync|supplyAsync)\s*\(|(?i:enable[._]?auto[._]?commit)\w*"?\s*[,(=:]\s*(?:"?false"?|Boolean\s*\.\s*FALSE))'
          # Manual commits, a listener acknowledgment, offsets committed in a
          # producer transaction, or offsets kept in an external store (seek).
          absent: '\b(commitSync|commitAsync|acknowledge|sendOffsetsToTransaction)\s*\(|\.\s*seek\s*\('
          confidence: low
          note: "KafkaConsumer.poll() loop with no manual offset commit — auto-commit can ack a record before it is processed"
        - id: S07-java-rabbitmq-auto-ack
          kind: regex
          pattern: '\.\s*basicConsume\s*\(\s*(?:[^,()]|\([^()]*\))+,\s*true\s*,'
          # A server-named queue (`queueDeclare()`) or one declared exclusive
          # is deleted with the consumer's connection, so acking saves nothing
          # after a crash; direct reply-to requires autoAck=true.
          absent_within: 'queueDeclare\s*\(\s*\)|queueDeclare\s*\([^,()]*,\s*\w+\s*,\s*true\s*,|amq\.rabbitmq\.reply-to'
          window: 1
          window_before: 25
          confidence: low
          note: "RabbitMQ basicConsume with autoAck=true — a crash mid-message loses it"

  - id: S08
    name: Bounded result sets and pagination
    tier: A
    weight: 1.0
    metastable_role: amplifier
    failure_if_absent: >-
      Memory exhaustion, timeouts, and oversized LLM prompts as the data
      grows. Works fine until one row count crosses a threshold.
    references:
      - "Nygard, Release It! (2nd ed.), ch. 4 — Unbounded Result Sets"
    detectors:
      typescript:
        - id: S08-ts-unbounded-promise-all
          kind: regex
          pattern: '\bPromise\s*\.\s*(all|allSettled)\s*\('
          absent_within: '(?i:\b(slice|chunk|batch|limit|pLimit|p-limit|concurrency|take|semaphore)\b)|Promise\s*\.\s*(all|allSettled)\s*\(\s*\[(?![^\]]*(?:\.\.\.|\.map\s*\())|Promise\s*\.\s*(?:all|allSettled)\s*\(\s*[A-Z][A-Z0-9_]*\s*\.\s*map\s*\('
          window: 5
          window_before: 10
          confidence: medium
          note: "Promise.all over an unbounded collection — concurrency equals input size"
        - id: S08-ts-findmany-without-take
          kind: regex
          pattern: '\.\s*findMany\s*\('
          absent_within: '\btake\s*:'
          window: 10
          confidence: medium
          note: "Prisma findMany with no take: — result set grows with the table"
        - id: S08-ts-select-without-limit
          kind: regex
          pattern: '(?i)SELECT\s+.*\s+FROM\s+'
          absent_within: '(?i)\bLIMIT\b|\bFETCH\s+FIRST\b|\bTOP\s*\(?\s*\d|\A[^\n]*?SELECT\s+(?:COUNT|MAX|MIN|SUM|AVG|EXISTS)\s*\(|\A(?:(?!\bSELECT\b)[\s\S])*SELECT\b(?:(?!\bSELECT\b)[^;])*?\bWHERE\s+(?:\w+\.)?id\s*=(?!\s*ANY\b)'
          window: 6
          confidence: low
          note: "multi-row SELECT with no LIMIT"
      python:
        - id: S08-py-unbounded-gather
          kind: regex
          pattern: '\basyncio\s*\.\s*gather\s*\('
          absent_within: '(?i)\b(semaphore|slice|chunk|batch|limit|islice)\b|gather\s*\((?:[^*()]|\([^()]*\))*\)'
          window: 5
          window_before: 10
          confidence: medium
          note: "asyncio.gather over an unbounded collection — concurrency equals input size"
        - id: S08-py-query-all-without-limit
          kind: regex
          pattern: '\.\s*(all|fetchall)\s*\(\s*\)'
          absent_within: '(?i)\b(limit|slice|first|paginate|yield_per|stream)\b'
          window: 4
          confidence: low
          note: "full result-set fetch with no limit"
          require: '^\s*(?:from|import)\s+(?:sqlalchemy|sqlmodel|django|psycopg2?|sqlite3|pymysql|MySQLdb|asyncpg|aiosqlite|peewee|tortoise|pymongo|motor|databases|records)\b|\.objects\b|\.query\s*[.(]|\b(?:cursor|cur|conn|connection|session|db)\w*\s*\.\s*execute\s*\('
        - id: S08-py-select-without-limit
          kind: regex
          pattern: '(?i)SELECT\s+.*\s+FROM\s+'
          absent_within: '(?i)\bLIMIT\b|\bFETCH\s+FIRST\b|\bTOP\s*\(?\s*\d|\A[^\n]*?SELECT\s+(?:COUNT|MAX|MIN|SUM|AVG|EXISTS)\s*\(|\A(?:(?!\bSELECT\b)[\s\S])*SELECT\b(?:(?!\bSELECT\b)[^;])*?\bWHERE\s+(?:\w+\.)?id\s*=(?!\s*ANY\b)'
          window: 6
          confidence: low
          note: "multi-row SELECT with no LIMIT"
      java:
        - id: S08-java-repository-no-pageable
          kind: file_absent
          anchor: 'interface\s+\w+\s+extends\s+[\w<>, .]*Repository\b'
          # A by-id finder is bounded by the ids the caller passes in.
          require: '(?m)^\s*(List|Collection|Set|Iterable|Stream)\s*<[^>]*>\s+(?!\w*ByIds?(?:In)?\s*\()(find|read|get|query|stream)\w*\s*\('
          # Bounded forms: paging/slicing/scrolling, a Top-N/First-N name, a
          # Limit parameter, a LIMIT/FETCH FIRST in a @Query, and a Stream
          # finder given a fetch size (a cursor, not a materialised list).
          absent: '\bPageable\b|\b(Page|Slice|Window)\s*<|\b(find|read|get|query|stream)\w*?(Top|First)\d+|\bLimit\s+\w+\s*[,)]|(?i:\bLIMIT\s+(\d|:|\?)|\bFETCH\s+FIRST\b)|FETCH_SIZE|[Ff]etchSize'
          confidence: low
          note: "Spring Data repository with collection finders and no Pageable/Slice/Top-N form — every call returns the whole match set"
        - id: S08-java-kafka-no-max-poll-records
          kind: file_absent
          anchor: '^(?!\s*import\s).*\bKafkaConsumer\b'
          # A one-argument (Kafka) poll in a file whose loop does blocking
          # per-record work: an HTTP call, a JDBC/repository write, a sleep,
          # or a blocking wait on a producer send. The default 500 records is
          # already a bound; it overruns max.poll.interval.ms only when each
          # record is slow, which a print or an in-memory update never is.
          require: '\A(?=[\s\S]*?\.\s*poll\s*\((?![^;\n]*TimeUnit)\s*[^\s)][^;\n]*\))[\s\S]*?(?:\b(?:RestTemplate|RestClient|WebClient|HttpClient|OkHttpClient|JdbcTemplate)\b|\.\s*(?:executeUpdate|executeBatch|batchUpdate|saveAll|save|postForObject|postForEntity|exchange)\s*\(|\bThread\s*\.\s*sleep\s*\(|\.\s*send\s*\([^;]*\)\s*\.\s*get\s*\(|\.\s*block\s*\(\s*\))'
          # max.poll.records set in the file (constant, property string or
          # setter), or max.poll.interval.ms raised to fit the work.
          absent: 'max\.poll\.(records|interval)|MAX_POLL_(RECORDS|INTERVAL)|[Mm]axPoll(Records|Interval)\w*\s*\(\s*[^\s)]'
          confidence: low
          note: "Kafka poll loop with no max.poll.records — a slow batch overruns max.poll.interval.ms and triggers a rebalance storm"

  - id: S09
    name: Single-flight / request coalescing plus caching
    tier: A
